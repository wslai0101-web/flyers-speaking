<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flyers Blaster 口說練習</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2440;--muted:#5b6585;--yellow:#ffd23f;--red:#ff4d5e;--green:#2fd16f;--blue:#2d7dff;--purple:#8a5cff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#38b6ff,#c4efff);min-height:100vh;padding:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:640px;margin:0 auto}
.en{font-family:'Lilita One',sans-serif;letter-spacing:.5px}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:16px;padding:8px 14px;margin-bottom:14px}
.top .me{flex:1;font-weight:900;font-size:17px;min-width:0}
.top .av{font-size:28px}
.pill{background:#fff;color:var(--ink);border-radius:999px;padding:3px 12px;font-weight:900;white-space:nowrap}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;text-align:center}
.title{font-family:'Lilita One','Noto Sans TC',sans-serif;font-size:34px;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 4px 0 var(--ink);text-align:center;margin:6px 0 14px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.part{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px}
.part:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.part i{font-style:normal;font-size:36px}
.part b{display:block;font-size:18px}
.part small{color:var(--muted);font-weight:700}
.btn{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:11px 20px;font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.go{background:var(--green)}
.btn.mic{background:var(--red);color:#fff;font-size:21px;padding:14px 26px}
.btn.mic.on{background:var(--ink);animation:pulse 1s infinite}
.btn:disabled{opacity:.5}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--ink),0 0 0 10px rgba(255,77,94,.4)}}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tag{font-family:'Lilita One',sans-serif;color:var(--muted);font-size:15px}
.ask{font-weight:900;font-size:17px;margin:6px 0}
.scene{font-size:clamp(46px,13vw,76px);line-height:1.25;margin:10px 0;word-spacing:6px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.panels div{border:3px solid var(--ink);border-radius:14px;background:#e7f5ff;font-size:clamp(32px,10vw,50px);padding:14px 4px;position:relative}
.panels b{position:absolute;left:6px;top:2px;font-size:14px;color:var(--muted)}
.say{background:#e7f5ff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:900;font-size:19px;margin:10px 0}
.mini{border:2px solid var(--ink);background:#fff;border-radius:8px;font-size:15px;padding:1px 6px;margin-left:4px}
.heard{min-height:48px;background:#f1f3f9;border-radius:12px;padding:10px;font-weight:700;margin-top:12px;font-size:17px;word-break:break-word}
.fb{border-radius:14px;padding:12px;margin-top:12px;font-weight:700}
.fb.ok{background:#d3f9d8}.fb.no{background:#fff3bf}.fb.bad{background:#ffe3e3}
.fb b{font-size:20px;display:block}
.model{margin-top:8px;font-weight:900;color:#1c5d99}
.hint{color:var(--muted);font-weight:700;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top hidden" id="top"><span class="av" id="av"></span><div class="me" id="me"></div><span class="pill">🪙 今天 <b id="today">0</b>/<span id="cap">0</span></span></div>
  <div id="view"><div class="card">載入中…</div></div>
</div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbypBJXU6OgwcN4gZMcEO42vhJ3Tc9uswtGp3nLjNKrgQNFJrrmXoInzzunpquLQn-CJ/exec';
const ROUND = 5;
const PARTS = {
  diff:  { icon:'🔍', zh:'找不同',       en:'Find the difference', tip:'聽老師說他的圖，說出你的圖哪裡不一樣', how:'看你的圖。老師的圖不一樣，用 In my picture… 說出來！' },
  odd:   { icon:'🧩', zh:'找不同類',     en:'Odd one out',         tip:'說出哪一個不同類，還有為什麼',         how:'哪一個不同類？用 The … is different because … 說出來！' },
  story: { icon:'📖', zh:'看圖說故事',   en:'Tell the story',      tip:'看 4 張圖，把故事說完',                how:'老師先說第一句，你接著把 4 張圖的故事說完。說完按「說完了」。' },
  ask:   { icon:'💬', zh:'個人問答',     en:'About you',           tip:'回答關於你自己的問題',                 how:'聽問題，用完整的句子回答！' },
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const G = { ticket:'', info:null, list:[], idx:0, part:'', earned:0, passed:0, rec:null, text:'', busy:false, away:false, hiddenAt:0, active:false };

function store(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
async function post(fn, extra){
  const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(Object.assign({ fn, ticket:G.ticket }, extra)) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'BAD');
  return j.data;
}
function speak(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = .85;
  const v = speechSynthesis.getVoices().find(v => /en[-_]GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function fail(title, msg){ $('#top').classList.add('hidden'); $('#view').innerHTML = `<div class="card"><div style="font-size:54px">😢</div><h2>${esc(title)}</h2><p>${esc(msg)}</p></div>`; }

async function boot(){
  const m = location.hash.match(/c=([a-f0-9]{32})/);
  if (m) { store('fb_speak', m[1]); history.replaceState(null, '', location.pathname); }  // 通行票不留在網址上
  G.ticket = store('fb_speak') || '';
  if (!G.ticket) return fail('請從遊戲打開這一頁', '回到 Flyers Blaster 遊戲，在地圖上按「🗣️ 口說練習」。');
  if (!SR) return fail('這個瀏覽器不支援語音辨識', '請改用電腦的 Chrome 或 Edge，或 iPad 的 Safari。');
  try { G.info = await post('speakInfo'); }
  catch (e) { return e.message === 'TICKET' ? fail('通行票過期了', '通行票 2 小時後會失效。請回到遊戲，再按一次「🗣️ 口說練習」。') : fail('連線失敗', '請確認網路，再重新整理這一頁。'); }
  $('#top').classList.remove('hidden');
  $('#av').textContent = G.info.avatar; $('#me').textContent = G.info.nickname; $('#cap').textContent = G.info.cap;
  menu();
}
function coinsBar(){ $('#today').textContent = G.info.todayCoins; }
function menu(){
  G.active = false; coinsBar();
  $('#view').innerHTML = `<div class="title">SPEAKING 口說練習</div><div class="menu">${Object.keys(PARTS).map(k => { const p = PARTS[k];
    return `<button class="part" data-p="${k}"><i>${p.icon}</i><span><b>${p.zh}</b><small>${p.tip}</small></span></button>`; }).join('')}</div>
    <p class="hint" style="text-align:center;color:var(--ink)">第一次按麥克風時，瀏覽器會詢問，請按「允許」。<br>聲音會送到 Google 或微軟轉成文字，不會錄音存檔。練完直接關掉這個分頁，回遊戲就會看到金幣。</p>`;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => start(b.dataset.p));
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function start(part){
  const all = G.info.questions.filter(q => q.part === part), done = G.info.done;
  const fresh = shuffle(all.filter(q => done.indexOf(q.id) < 0)), old = shuffle(all.filter(q => done.indexOf(q.id) >= 0));
  G.list = fresh.concat(old).slice(0, part === 'story' ? 1 : ROUND);
  G.part = part; G.idx = 0; G.earned = 0; G.passed = 0;
  show();
}
function show(){
  const q = G.list[G.idx], p = PARTS[G.part];
  G.text = ''; G.away = false; G.hiddenAt = 0; G.active = true;
  let body = '';
  if (q.part === 'story') body = `<div class="panels">${q.panels.map((x, i) => `<div><b>${i + 1}</b>${esc(x)}</div>`).join('')}</div>`;
  else if (q.scene) body = `<div class="scene">${esc(q.scene)}</div>`;
  if (q.say) body += `<div class="say">${q.part === 'diff' ? '👩‍🏫 ' : ''}${esc(q.say)} <button class="mini" id="again">🔊</button></div>`;
  $('#view').innerHTML = `<div class="card"><div class="tag">${esc(p.en)} · ${G.idx + 1}/${G.list.length}</div><div class="ask">${esc(p.how)}</div>${body}
    <div class="row"><button class="btn mic" id="mic">🎤 按我開始說</button></div>
    <div class="heard" id="heard">（你說的話會顯示在這裡）</div><div id="fb"></div>
    <div class="row"><button class="btn" id="back">🏠 回選單</button><button class="btn go hidden" id="next">下一題 ▶</button></div></div>`;
  if (q.say) { $('#again').onclick = () => speak(q.say); setTimeout(() => speak(q.say), 300); }
  $('#mic').onclick = toggleMic;
  $('#back').onclick = () => { stopRec(true); speechSynthesis.cancel(); menu(); };
  $('#next').onclick = () => { G.idx++; G.idx < G.list.length ? show() : finish(); };
}
function stopRec(abort){ const r = G.rec; if (!r) return; try { abort ? r.abort() : r.stop(); } catch (e) {} if (abort) G.rec = null; }
function toggleMic(){
  if (G.busy) return;
  if (G.rec) return stopRec(false);
  const q = G.list[G.idx], long = q.part === 'story', rec = new SR();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  G.rec = rec; G.text = '';
  rec.lang = 'en-GB'; rec.interimResults = true; rec.continuous = long; rec.maxAlternatives = 1;
  const mic = $('#mic'), heard = $('#heard');
  let error = '', limit = 0;
  mic.classList.add('on'); mic.textContent = long ? '✅ 說完了' : '🔴 聽取中…（再按一次結束）';
  $('#fb').innerHTML = ''; heard.textContent = '🔴 請開始說…';
  rec.onresult = e => { G.text = [...e.results].map(r => r[0].transcript).join(' ').trim(); heard.textContent = G.text; };
  rec.onerror = e => { error = e.error; };
  rec.onend = () => {
    clearTimeout(limit);
    if (G.rec !== rec) return;
    G.rec = null; mic.classList.remove('on'); mic.textContent = '🎤 再說一次';
    if (G.text) return judge();
    const msg = { 'not-allowed':'麥克風被擋住了：請點網址列左邊的圖示，把「麥克風」改成「允許」，再重新整理。',
      'service-not-allowed':'這個瀏覽器不允許語音辨識，請改用 Chrome 或 Edge。', 'network':'語音辨識要連網路，請確認網路後再試一次。',
      'audio-capture':'找不到麥克風，請確認有麥克風或插上耳機麥克風。' }[error] || '沒有聽到聲音，靠近麥克風、說大聲一點再試一次。';
    heard.textContent = msg;
  };
  try { rec.start(); limit = setTimeout(() => stopRec(false), long ? 90000 : 20000); }
  catch (e) { G.rec = null; heard.textContent = '語音辨識無法啟動，請重新整理這一頁。'; }
}
async function judge(){
  const q = G.list[G.idx], box = $('#fb');
  G.busy = true; $('#mic').disabled = true; box.innerHTML = '<div class="fb no">批改中…</div>';
  let r;
  try { r = await post('speakJudge', { qid:q.id, text:G.text, away:G.away }); }
  catch (e) {
    G.busy = false; $('#mic').disabled = false;
    box.innerHTML = `<div class="fb bad">${e.message === 'TICKET' ? '通行票過期了，請回遊戲再按一次「口說練習」。' : '連線失敗，請再說一次。'}</div>`;
    return;
  }
  G.busy = false; $('#mic').disabled = false;
  G.info.todayCoins = r.todayCoins; coinsBar();
  if (r.ok && !r.away && G.info.done.indexOf(q.id) < 0) G.info.done.push(q.id);
  const model = `<div class="model">📣 參考說法：${esc(r.model)} <button class="mini" id="say-model">🔊</button></div>`;
  if (r.ok && r.away) box.innerHTML = `<div class="fb bad"><b>🤔 這題不算喔</b>作答時有離開畫面，這題沒有金幣。${model}</div>`;
  else if (r.ok) {
    G.passed++; G.earned += r.coin;
    box.innerHTML = `<div class="fb ok"><b>🎉 Great!${r.coin ? ` 🪙 +${r.coin}` : ''}</b>${r.repeat ? '這題今天答對過了，沒有金幣，換別題吧！' : !r.coin ? '今天的口說金幣已經領滿了！' : ''}${model}</div>`;
  } else {
    box.innerHTML = `<div class="fb no"><b>再試試看！</b>${esc(r.tip)}${model}</div>`;
  }
  $('#say-model').onclick = () => speak(r.model);
  $('#next').classList.remove('hidden');
  $('#next').textContent = G.idx + 1 < G.list.length ? '下一題 ▶' : '看結果 ▶';
}
function finish(){
  G.active = false;
  $('#view').innerHTML = `<div class="card"><div style="font-size:60px">🏆</div><h2 class="en">WELL DONE!</h2>
    <p style="font-size:19px;font-weight:900">說對 ${G.passed} / ${G.list.length} 題・🪙 +${G.earned}</p><p class="hint">關掉這個分頁回到遊戲，金幣就會更新。</p>
    <div class="row"><button class="btn go" id="menu">再練一組</button></div></div>`;
  $('#menu').onclick = menu;
}
// 防作弊：作答時切到別的分頁 2 秒以上，這題不給金幣
document.addEventListener('visibilitychange', () => {
  if (!G.active) return;
  if (document.visibilityState === 'hidden') G.hiddenAt = Date.now();
  else if (G.hiddenAt) { if (Date.now() - G.hiddenAt >= 2000) G.away = true; G.hiddenAt = 0; }
});
boot();
</script>
</body>
</html>
