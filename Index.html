<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita&#43;One&amp;family=Noto&#43;Sans&#43;TC:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2440; --muted:#5b6585; --sky1:#38b6ff; --sky2:#c4efff;
  --yellow:#ffd23f; --red:#ff4d5e; --green:#2fd16f; --blue:#2d7dff; --purple:#8a5cff; --orange:#ffa94d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2));min-height:100vh;touch-action:manipulation;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
.en{font-family:'Lilita One',sans-serif;letter-spacing:.5px}

 
.screen{display:none;min-height:100vh}
.screen.active{display:block}
.center-screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.logo{font-family:'Lilita One',sans-serif;font-size:clamp(46px,11vw,88px);line-height:.92;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 7px 0 var(--ink);letter-spacing:2px;margin-bottom:10px}
.logo span{color:var(--yellow)}
.tag{font-weight:900;font-size:18px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--ink)}
.hint{color:var(--ink);opacity:.75;font-size:14px;font-weight:700}
.loader{width:56px;height:56px;margin:24px auto 10px;background:var(--yellow);border:4px solid var(--ink);border-radius:10px;animation:spin 1s steps(4) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

 
.btn{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:11px 20px;font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--green)}
.btn.warn{background:var(--orange)}
.btn.ghost{background:#eef1f7}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:42px;height:42px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:20px;box-shadow:0 3px 0 var(--ink);flex:none}
.mini{border:2px solid var(--ink);background:#e7f5ff;border-radius:8px;font-size:15px;padding:1px 6px;vertical-align:middle}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}

 
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;width:min(920px,100%);margin:26px 0 16px}
.slot{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:16px 10px;box-shadow:0 6px 0 var(--ink);transition:transform .1s}
.slot:hover{transform:translateY(-3px)}
.slot.empty{background:rgba(255,255,255,.55);border-style:dashed}
.slot.empty .avatar{background:#fff;color:var(--muted)}
.slot.reset .avatar{background:var(--orange)}
.avatar{font-size:50px;width:84px;height:84px;display:grid;place-items:center;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;margin:0 auto 8px;box-shadow:0 4px 0 var(--ink)}
.avatar.sm{width:46px;height:46px;font-size:28px;margin:0;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.s-name{font-weight:900;font-size:20px;word-break:break-all}
.s-sub{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}

 
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar .me{display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
.topbar .me b{font-size:18px;display:block}
.topbar .me small{color:var(--yellow);font-weight:700}
.pill{background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;border:2px solid #000}
.stats{display:flex;gap:8px}
.tools{display:flex;gap:8px}
.map-wrap{max-width:1000px;margin:0 auto;padding:16px}
.map-title{font-family:'Lilita One',sans-serif;font-size:28px;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);margin:18px 0 12px}
.map-title small{font-family:'Noto Sans TC';font-size:14px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;margin-left:8px}
.stage-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stage{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 14px 12px;box-shadow:0 6px 0 var(--ink);text-align:left;transition:transform .1s}
.stage:hover{transform:translateY(-3px)}
.stage .st-num{font-family:'Lilita One',sans-serif;font-size:14px;background:var(--ink);color:#fff;display:inline-block;padding:1px 8px;border-radius:6px}
.stage .st-icon{font-size:40px;margin:6px 0 2px}
.stage .st-name{font-family:'Lilita One',sans-serif;font-size:22px}
.stage .st-zh{font-weight:900;color:var(--muted)}
.stage .st-tip{font-size:13px;color:var(--muted);margin-top:4px}
.stage .st-stars{font-size:22px;color:#d6dbe6;margin-top:6px;letter-spacing:2px}
.stage .st-stars .on{color:#ffb800;text-shadow:0 2px 0 var(--ink)}
.stage .st-shield{position:absolute;right:12px;top:12px}
.stage.locked{filter:grayscale(.85);opacity:.6}
.stage.boss{grid-column:1/-1;background:linear-gradient(135deg,#3b1f6e,#7b2cbf);color:#fff}
.stage.boss .st-zh,.stage.boss .st-tip{color:#e3d5ff}
.stage.boss .st-num{background:var(--red)}
.cont-card{background:var(--yellow);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:glow 1.6s ease-in-out infinite}
.cont-card .grow{flex:1;min-width:180px;font-weight:900;font-size:17px}
@keyframes glow{50%{box-shadow:0 6px 0 var(--ink),0 0 0 8px rgba(255,210,63,.45)}}
.map-actions{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 40px}

 
.screen.game.active{display:flex;flex-direction:column;height:100vh;height:100dvh}
.hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink);color:#fff;flex:none}
.hud-mid{flex:1;min-width:0}
.hud-title{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-top:4px}
#hud-bar{height:100%;background:var(--yellow);width:0;transition:width .4s}
.hud-q{font-family:'Lilita One',sans-serif;font-size:18px}
.hud-shields{display:flex;gap:2px}
.hud-shields .broken{opacity:.25;filter:grayscale(1)}
.hud-shields .crack{animation:crack .5s}
@keyframes crack{30%{transform:scale(1.4) rotate(-15deg)}}
.hud-score{text-align:right;min-width:62px}
.hud-score b{font-family:'Lilita One',sans-serif;font-size:22px;color:var(--yellow);display:block;line-height:1}
.hud-score small{font-weight:900;color:var(--orange)}
.boss-bar{display:flex;align-items:center;gap:10px;padding:4px 12px;background:#2b1d4f;color:#fff;font-family:'Lilita One',sans-serif;flex:none}
.boss-bar .bb{flex:1;height:14px;background:#0006;border:2px solid #000;border-radius:7px;overflow:hidden}
#boss-hp{height:100%;background:linear-gradient(90deg,#ff4d5e,#ff8a5c);transition:width .5s}
.timer{height:8px;background:#0003;flex:none}
#timer-bar{height:100%;background:var(--yellow);transition:width 1s linear}
#timer-bar.low{background:var(--red)}

.arena{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding:12px 12px 0;background:linear-gradient(180deg,#54c4ff,#c7f0ff 75%);cursor:crosshair}
.arena.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,0)}}
.arena.flash::after{content:'';position:absolute;inset:0;background:rgba(255,40,70,.28);pointer-events:none;animation:fade .4s forwards}
@keyframes fade{to{opacity:0}}
.cloud{position:absolute;width:110px;height:30px;background:#fff;opacity:.8;border-radius:6px;animation:drift 38s linear infinite;pointer-events:none}
.cloud::before{content:'';position:absolute;left:22px;top:-18px;width:52px;height:24px;background:#fff;border-radius:6px}
.cloud.k1{top:40px;left:-120px}
.cloud.k2{top:150px;left:-120px;animation-delay:-14s;transform:scale(.7)}
.cloud.k3{top:90px;left:-120px;animation-delay:-27s}
@keyframes drift{to{left:110%}}
.ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:repeating-linear-gradient(90deg,#3fb24d 0 32px,#4ac75a 32px 64px);border-top:6px solid #2b8a3e;pointer-events:none}

.qpanel{position:relative;z-index:2;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);padding:12px 16px;max-width:900px;width:100%;margin:0 auto;flex:none;cursor:default}
.q-tag{font-family:'Lilita One',sans-serif;color:var(--muted);font-size:14px;margin-bottom:4px}
.q-main{font-size:clamp(19px,3vw,25px);font-weight:900;line-height:1.5}
.q-emoji{font-size:36px;vertical-align:middle;margin-right:8px}
.gap{display:inline-block;min-width:70px;border-bottom:4px solid var(--purple);margin:0 4px}
.passage{background:#fff8e1;border:2px dashed #e0b300;border-radius:12px;padding:10px 12px;max-height:30vh;overflow:auto;font-size:17px;line-height:1.65;margin-bottom:10px}
.bubble{display:inline-block;padding:8px 14px;border-radius:14px;border:3px solid var(--ink);margin:3px 0;font-size:clamp(18px,2.8vw,23px);font-weight:900}
.bubble.a{background:#e7f5ff}
.bubble.b{background:#fff3bf;margin-left:28px}
.radar{display:flex;align-items:center;gap:12px;margin:2px 0 8px;border:3px solid var(--ink);background:var(--blue);color:#fff;border-radius:999px;padding:8px 18px 8px 10px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.radar i{font-style:normal;font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#fff;border-radius:50%;border:3px solid var(--ink);animation:ping 1.4s infinite}
@keyframes ping{50%{box-shadow:0 0 0 10px rgba(255,255,255,.35)}}
.blanks{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.blank{width:40px;height:50px;border-bottom:5px solid var(--ink);font-family:'Lilita One',sans-serif;font-size:36px;display:grid;place-items:center;text-transform:uppercase}
.blank.filled{color:var(--green)}
.blank.shown{color:var(--red)}

.targets{position:relative;z-index:2;flex:1 0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px 16px;align-content:center;justify-items:center;padding:18px 6px 150px;max-width:900px;width:100%;margin:0 auto}
.targets.letters{grid-template-columns:repeat(auto-fit,minmax(74px,1fr));max-width:640px}
.enemy{position:relative;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:crosshair;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d,0s);max-width:100%}
@keyframes bob{50%{transform:translateY(-10px)}}
.e-head{width:56px;height:42px;background:var(--ec);border:3px solid var(--ink);border-radius:8px 8px 4px 4px;display:flex;justify-content:center;align-items:center;gap:12px;box-shadow:inset 0 -7px 0 rgba(0,0,0,.18);position:relative;z-index:1}
.e-head i{width:9px;height:13px;background:#111;border-radius:2px;box-shadow:inset 3px 3px 0 #fff}
.e-body{margin-top:-3px;min-width:130px;max-width:100%;padding:10px 14px;background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink);font-weight:900;font-size:clamp(16px,2.4vw,20px);line-height:1.3;color:var(--ink)}
.letters .e-head{width:40px;height:30px;gap:8px}
.letters .e-head i{width:6px;height:9px}
.letters .e-body{min-width:58px;font-family:'Lilita One',sans-serif;font-size:32px;padding:4px 10px;text-transform:uppercase}
.enemy:hover .e-body,.enemy:focus-visible .e-body{outline:4px dashed var(--red);outline-offset:3px}
.c0{--ec:#ff6b6b}.c1{--ec:#ffa94d}.c2{--ec:#9775fa}.c3{--ec:#4dabf7}.c4{--ec:#69db7c}
.enemy.hit{animation:boom .45s forwards;pointer-events:none}
@keyframes boom{40%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(0) rotate(-30deg);opacity:0}}
.enemy.miss{animation:jolt .45s}
.enemy.miss .e-head{--ec:#ff2e4d}
@keyframes jolt{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.enemy.reveal .e-body{background:#d3f9d8;border-color:#2b8a3e;box-shadow:0 5px 0 #2b8a3e,0 0 0 6px rgba(47,209,111,.4)}
.enemy.hint .e-body{outline:4px solid var(--yellow);outline-offset:3px}
.enemy:disabled{cursor:default}

.gun{position:absolute;left:50%;bottom:58px;width:36px;height:74px;transform:translateX(-50%);transform-origin:50% 85%;transition:transform .12s;z-index:3;pointer-events:none}
.gun .barrel{position:absolute;left:9px;top:0;width:18px;height:46px;background:#6c7a99;border:3px solid var(--ink);border-radius:4px}
.gun .barrel::before{content:'';position:absolute;left:1px;top:3px;width:10px;height:6px;background:#7df9ff}
.gun .body{position:absolute;left:0;bottom:0;width:36px;height:34px;background:var(--red);border:3px solid var(--ink);border-radius:8px}
.player{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:4;pointer-events:none}
.fx{position:absolute;left:0;top:0;width:100%;height:0;z-index:6;pointer-events:none}
.beam{position:absolute;height:7px;border-radius:4px;background:linear-gradient(90deg,#fff,var(--c));box-shadow:0 0 14px var(--c);transform-origin:0 50%;animation:beam .32s ease-out forwards}
@keyframes beam{0%{transform:rotate(var(--a)) scaleX(0);opacity:1}45%{transform:rotate(var(--a)) scaleX(1);opacity:1}100%{transform:rotate(var(--a)) scaleX(1);opacity:0}}
.px{position:absolute;width:11px;height:11px;background:var(--c);border:2px solid var(--ink);animation:px .65s ease-out forwards}
@keyframes px{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.float{position:absolute;transform:translateX(-50%);font-family:'Lilita One',sans-serif;font-size:28px;color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);white-space:nowrap;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}

.feedback{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(640px,calc(100% - 24px));z-index:20;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:14px 16px;text-align:center;animation:pop .25s}
.feedback.ok{background:#ebfbee}
.feedback.bad{background:#fff5f5}
.fb-title{font-family:'Lilita One','Noto Sans TC',sans-serif;font-size:26px}
.fb-ans{font-size:19px;margin:6px 0}
.fb-ans b{color:#2b8a3e}
.fb-exp{font-size:15px;color:var(--muted);margin:6px 0 10px;line-height:1.5}
.fb-heal{font-weight:900;color:var(--blue)}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
.banner{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(27,36,64,.55);pointer-events:none;animation:fade 1.7s ease-in forwards;animation-delay:.6s}
.banner div{background:var(--yellow);border:4px solid var(--ink);border-radius:20px;padding:18px 30px;box-shadow:0 8px 0 var(--ink);text-align:center;animation:pop2 .4s}
.banner .en{font-size:42px}
@keyframes pop2{from{transform:scale(.5)}}

 
.result-card{background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:24px 20px;width:min(480px,100%)}
.res-title{font-family:'Lilita One',sans-serif;font-size:44px;line-height:1}
.res-title.win{color:var(--green);-webkit-text-stroke:2px var(--ink)}
.res-title.lose{color:var(--red);-webkit-text-stroke:2px var(--ink)}
.res-stars{font-size:58px;letter-spacing:6px;color:#dde2ea;margin:8px 0}
.res-stars .on{color:#ffb800;text-shadow:0 4px 0 var(--ink);display:inline-block;animation:starpop .5s backwards;animation-delay:calc(var(--i)*.3s)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.res-shield{font-weight:900;margin:6px 0}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.res-stats div{background:#f1f3f9;border-radius:12px;padding:8px}
.res-stats b{display:block;font-family:'Lilita One',sans-serif;font-size:24px}
.res-note{font-weight:700;color:var(--muted)}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

 
.modal{position:fixed;inset:0;background:rgba(27,36,64,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal-card{background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:20px;width:min(440px,100%);max-height:92vh;overflow:auto;text-align:center}
.modal-card h2{margin:6px 0 10px}
.modal-card label{display:block;text-align:left;font-weight:900;margin:12px 0 6px}
.modal-card input{width:100%;padding:11px 12px;border:3px solid var(--ink);border-radius:12px;font-size:18px}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.av{font-size:28px;border:3px solid #dfe3ec;background:#fff;border-radius:10px;padding:4px 0}
.av.on{border-color:var(--ink);background:var(--yellow)}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:12px 0}
.pin-dots span{width:20px;height:20px;border:3px solid var(--ink);border-radius:50%}
.pin-dots span.on{background:var(--ink)}
.pin-dots.shake{animation:jolt .4s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.key{height:62px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:'Lilita One',sans-serif;font-size:28px;box-shadow:0 4px 0 var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.ok{background:var(--green)}
.err{color:var(--red);font-weight:900;min-height:22px;margin-top:8px}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.wall div{background:#f1f3f9;border-radius:14px;padding:10px 6px;font-size:13px;font-weight:700}
.big-emoji{font-size:60px}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:900;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.save-ind{position:fixed;right:8px;bottom:8px;z-index:25;font-size:12px;font-weight:900;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;opacity:.85}
.save-ind:empty{display:none}

 
.word-card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:14px 16px;margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.word-card .wc-icon{font-size:44px}
.word-card .grow{flex:1;min-width:200px}
.word-card .wc-title{font-family:'Lilita One','Noto Sans TC',sans-serif;font-size:22px}
.word-card .wc-sub{color:var(--muted);font-weight:700;font-size:14px}
.wc-bar{display:flex;height:12px;border:2px solid var(--ink);border-radius:7px;overflow:hidden;margin-top:6px;background:#eef1f7}
.wc-bar i{display:block;height:100%}
.learn-emoji{font-size:84px;line-height:1.1;margin-top:6px}
.learn-word{font-family:'Lilita One',sans-serif;font-size:46px;letter-spacing:1px}
.learn-zh{font-size:24px;font-weight:900}
.learn-def{color:var(--muted);font-size:17px;margin:8px 0}
.wb-list{text-align:left;max-height:50vh;overflow:auto;margin-top:10px}
.wb-row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid #eef1f7}
.wb-row b{font-size:17px}
.wb-row .grow{flex:1}
.wb-row .lv{color:#ffb800;letter-spacing:1px;white-space:nowrap}

 
.pk-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.pk-tab{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 14px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.pk-tab.on{background:var(--yellow)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:18px;min-height:240px}

.float.crit{font-size:38px;color:#ff4d5e}

const SFX = (() => {
  let ctx = null, muted = ls('fb_mute') === '1';
  function tone(f, dur, type = 'square', vol = .07, to){
    if (muted) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  return {
    click: () => tone(620, .05, 'square', .04),
    key:   () => tone(880, .03, 'square', .03),
    shoot: () => tone(900, .14, 'square', .05, 240),
    hit:   () => { tone(220, .18, 'sawtooth', .07, 60); setTimeout(() => tone(760, .12, 'triangle', .08), 70); },
    hurt:  () => tone(170, .38, 'sawtooth', .09, 60),
    heal:  () => [523, 784].forEach((f, i) => setTimeout(() => tone(f, .14, 'triangle', .08), i * 90)),
    kill:  () => [392, 523, 659, 1047].forEach((f, i) => setTimeout(() => tone(f, .12, 'square', .07), i * 80)),
    win:   () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .2, 'triangle', .09), i * 130)),
    lose:  () => [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, .25, 'triangle', .08), i * 180)),
    coin:  (combo = 0) => { const b = 988 * Math.pow(1.06, Math.min(combo, 12)); tone(b, .07, 'square', .05); setTimeout(() => tone(b * 1.335, .16, 'square', .05), 70); },
    crit:  () => { tone(1400, .25, 'sawtooth', .05, 300); setTimeout(() => tone(1760, .2, 'triangle', .07), 120); },
    siren: () => [0, 1, 2, 3].forEach(i => setTimeout(() => tone(i % 2 ? 520 : 780, .28, 'sawtooth', .05, i % 2 ? 780 : 520), i * 300)),
    gacha: (r = 'C') => { const n = { C:4, R:5, E:7, M:10 }[r]; for (let i = 0; i < n; i++) setTimeout(() => tone(523 * Math.pow(1.122, i), .14, 'triangle', .08), i * 70); },
    build: () => [262, 330, 392, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, .12, 'square', .06), i * 60)),
    toggle(){ muted = !muted; ls('fb_mute', muted ? '1' : '0'); return muted; },
    get muted(){ return muted; },
  };
})();
function speak(text, queue){
  if (!('speechSynthesis' in window)) return toast('這台裝置不支援語音朗讀');
  const s = window.speechSynthesis; if (!queue) s.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, ' blank '));
  u.lang = 'en-GB'; u.rate = .85;
  const voices = s.getVoices();
  const v = voices.find(v => /en[-_]GB/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  s.speak(u);
}

function save(logs){
  const P = S.progress;

  if (logs) Saver.logs.push(...logs.map(l => Object.assign({ time: Date.now() }, l)));
  ls(pkey(), JSON.stringify(P)); ls(lkey(), JSON.stringify(Saver.logs));
  Saver.dirty = true; flush();

function flush(){
  if (Saver.busy || !Saver.dirty || !S.token) return;
  Saver.busy = true; Saver.dirty = false;
  const logs = Saver.logs.splice(0);
  const snapshot = JSON.parse(JSON.stringify(S.progress));
  setInd('saving');
  api('saveProgress', S.token, snapshot, logs).then(() => {
    Saver.busy = false; ls(lkey(), JSON.stringify(Saver.logs));
    setInd(Saver.dirty ? 'saving' : 'saved'); flush();
  }).catch(err => {
    Saver.busy = false; Saver.logs.unshift(...logs); Saver.dirty = true;
    if (err.message === 'AUTH') return sessionExpired();
    setInd('offline'); clearTimeout(Saver.retry); Saver.retry = setTimeout(flush, 6000);
  });
}

function normProgress(p){
  p = p || {};
  const c = p.current;
  const okCur = c && Array.isArray(c.qids) && c.qids.length && c.idx < c.qids.length && c.shields > 0;
  const monsters = p.monsters || {};
  if (Array.isArray(p.wrong)) p.wrong.forEach(id => { if (!monsters['q:' + id]) monsters['q:' + id] = [MONSTER_HP, 0, dayNum()]; }); 
  // ...p：保留所有欄位，存檔時不會把不認得的紀錄洗掉
  return { ...p, rev:+p.rev || 0, savedAt:+p.savedAt || 0, stars:p.stars || {}, score:+p.score || 0,
           current: okCur ? c : null, bossWins:+p.bossWins || 0, plays:+p.plays || 0,
           words:p.words || {}, wordDay:p.wordDay || { d:0, n:0 },
           monsters, killTotal:+p.killTotal || 0, killLog:Array.isArray(p.killLog) ? p.killLog : [] };
}

function wordStats(){
  const P = S.progress, today = dayNum();
  let due = 0, mastered = 0, learning = 0;
  S.words.forEach(w => {
    const st = P.words[w.id];
    if (!st) return;
    if (st[0] >= 5) mastered++; else learning++;
    if (st[1] <= today) due++;
  });
  const usedToday = P.wordDay.d === today ? P.wordDay.n : 0;
  const unseen = S.words.length - mastered - learning;
  return { due, mastered, learning, unseen, today, newLeft: Math.min(unseen, Math.max(0, DAILY_NEW - usedToday)) };
}
 
function wordPlan(mode = 'normal'){
  const P = S.progress, ws = wordStats();
  if (mode === 'review') return shuffle(S.words.filter(w => P.words[w.id])).slice(0, SESSION_SIZE).map(w => ({ w, isNew:false }));
  const fresh = S.words.filter(w => !P.words[w.id]).slice(0, mode === 'extra' ? SESSION_NEW : Math.min(SESSION_NEW, ws.newLeft));
  if (mode === 'extra') return fresh.map(w => ({ w, isNew:true }));
  const due = S.words.filter(w => P.words[w.id] && P.words[w.id][1] <= ws.today)
    .sort((a, b) => P.words[a.id][1] - P.words[b.id][1] || P.words[a.id][0] - P.words[b.id][0])
    .slice(0, SESSION_SIZE - fresh.length);
  return [...fresh.map(w => ({ w, isNew:true })), ...due.map(w => ({ w, isNew:false }))];
}

function startWords(mode){
  const P = S.progress, plan = wordPlan(mode), today = dayNum();
  if (!plan.length) return toast('今天的份量完成了！可以到單字島選「加碼」或「自由複習」🎉', 3200);
  const fresh = plan.filter(p => p.isNew).map(p => p.w);
  if (P.wordDay.d !== today) P.wordDay = { d:today, n:0 };
  P.wordDay.n += fresh.length;
  fresh.forEach(w => { P.words[w.id] = [0, today]; });
  const gen = shuffle(plan.map(p => p.w)).map(w => makeWordQ(w));
  P.current = { stage:'WORDS', mode, qids:gen.map(q => q.id), gen, idx:0, shields:5, maxShields:5, timer:0,
                score:0, combo:0, maxCombo:0, correct:0, kills:0, bossHp:gen.length, startedAt:Date.now() };
  applyPerks(P.current);
  save();

/** 依熟練等級出題：0~1 認得（選擇）→ 2 半回想（射字母、聽音）→ 3 以上自己打字 */
function makeWordQ(w, forced){
  const lv = (S.progress.words[w.id] || [0])[0];
  const others = S.words.filter(x => x.word !== w.word);
  const pick = [...shuffle(others.filter(x => x.topic === w.topic)), ...shuffle(others)]
    .filter((x, i, a) => a.findIndex(y => y.word === x.word) === i).slice(0, 2);
  const options = [w.word, ...pick.map(x => x.word)];
  const kinds = forced ? ['type'] : lv <= 0 ? ['zh', 'def'] : lv === 1 ? ['def', 'zh'] : lv === 2 ? ['listen', 'spell'] : lv === 3 ? ['type', 'typeListen'] : ['type'];
  let kind = kinds[Math.floor(Math.random() * kinds.length)];
  if (kind === 'spell' && !/^[a-z]+$/.test(w.word)) kind = 'listen'; // 片語（有空白、-、'）不出射字母
  if (kind === 'def' && w.definition.includes('___')) kind = 'zh';   
  const base = { id:`W-${w.id}-${kind}`, stage:'WORDS', kind, emoji:w.emoji, passage:'', audio:'', answer:w.word,
                 explain:`${w.word} ${w.zh}：${w.definition}`, wid:w.id };
  if (kind === 'zh') return Object.assign(base, { type:'choice', prompt:`「${w.zh}」的英文是哪一個？`, options });
  if (kind === 'def') return Object.assign(base, { type:'choice', prompt:w.definition, options });
  if (kind === 'listen') return Object.assign(base, { type:'listen', emoji:'', prompt:'Which word do you hear?', audio:w.word, options });
  if (kind === 'spell') return Object.assign(base, { type:'spell', prompt:`${w.zh}：${w.definition}`, options:[] });
  if (kind === 'typeListen') return Object.assign(base, { type:'type', emoji:'', prompt:'聽聽看，打出你聽到的單字 Listen and type.', audio:w.word, options:[] });
  return Object.assign(base, { type:'type', prompt:`「${w.zh}」：${w.definition}`, options:[] });
}

  const list = monsterList().filter(hittable).sort((a, b) => a.hp - b.hp || a.born - b.born).slice(0, MONSTER_SESSION);
  if (!list.length) return toast(monsterList().length ? `怪獸都在休息，${restText()} 分鐘後再來！` : '監獄是空的，太厲害了！🎉', 3000);
  const gen = [], qids = [];
  shuffle(list).forEach(m => {
    if (m.k === 'w') { const q = makeWordQ(S.wordById[m.id], true); gen.push(q); qids.push(q.id); }
    else qids.push(m.id);
  });
  P.current = { stage:'MONSTER', qids, gen, idx:0, shields:3, maxShields:3, timer:0,
                score:0, combo:0, maxCombo:0, correct:0, kills:0, bossHp:qids.length, startedAt:Date.now() };
  applyPerks(P.current);
  save();
  playMission();
}
/** 答完一題後更新怪獸：答錯→生怪（或回血）；答對→扣血（被打後要休息 MONSTER_REST_MIN 分鐘） */
function monsterUpdate(q, ok){
  const P = S.progress, today = dayNum(), key = q.wid ? 'w:' + q.wid : 'q:' + q.id, m = P.monsters[key];
  if (!ok) {
    P.monsters[key] = [MONSTER_HP, m ? m[1] : 0, m ? m[2] : today];
    const keys = Object.keys(P.monsters);
    if (keys.length > MONSTER_MAX) delete P.monsters[keys.sort((a, b) => P.monsters[a][2] - P.monsters[b][2])[0]];
    return m ? '👾 怪獸回血了！記熟再來打牠' : '👾 這題變成怪獸，關進監獄了！';
  }
  if (!m) return '';
  if (q.wid && !isTyping(q)) return '';
  const rest = restLeft({ last:m[1] });
  if (rest) return `⏳ 這隻怪獸剛被打過，${rest} 分鐘後再來一擊！`;
  m[0]--; m[1] = Date.now();
  if (m[0] > 0) return `🩸 怪獸受傷了！還剩 ${m[0]} 滴血${MONSTER_REST_MIN ? `，${MONSTER_REST_MIN} 分鐘後到怪獸監獄補最後一擊` : ''}`;
  delete P.monsters[key];
  P.killTotal++; P.killLog = [...P.killLog, Date.now()].slice(-200);
  questAdd('mk');
  if (P.current) P.current.kills = (P.current.kills || 0) + 1;
  setTimeout(SFX.kill, 200);
  return '💀 消滅了一隻怪獸！';
}

/* ================= 養成系統：金幣、基地、扭蛋、每日任務 =================
   防弊設計：
   - 金幣只有「自己答對」才拿得到（離開畫面、貼上、自動輸入的題目 = 0 金幣、不算任務）
   - 同一關同一天重複玩，金幣遞減（FARM），鼓勵去玩別的島
   - 扭蛋先扣錢、先存檔，再播開獎動畫：重新整理不能重抽
   - 金幣存成「總共賺的 coinEarned」和「總共花的 coinSpent」兩個只會增加的數字，後台取大值保護
   - 基地的輔助能力在魔王關（模擬考）一律無效 */
function coins(){ const P = S.progress; return Math.max(0, (+P.coinEarned || 0) + (+P.speakCoins || 0) - (+P.coinSpent || 0)); }
function baseLv(){ return Math.min(BASE_LV.length, Math.max(1, +(S.progress && S.progress.baseLv) || 1)); }
function petOf(id){ return PETS.find(p => p[0] === id); }
function petBonus(){ const p = petOf(S.progress.petOn); return p ? RARITY[p[4]].bonus : 0; }
function feverMult(combo){ return combo >= 5 ? 3 : combo >= 3 ? 1.5 : 1; }
function farmMult(n){ return FARM.find(([max]) => n <= max)[1]; }
function coinDay(){ const P = S.progress, d = dayNum(); if (!P.coinDay || P.coinDay.d !== d) P.coinDay = { d, n:{} }; return P.coinDay; }
function questDay(){ const P = S.progress, d = dayNum(); if (!P.quest || P.quest.d !== d) P.quest = { d, ok:0, lr:0, mk:0, got:[0, 0, 0], all:0 }; return P.quest; }
function questAdd(k){ const q = questDay(); q[k] = (q[k] || 0) + 1; }
function earn(n){ S.progress.coinEarned = (+S.progress.coinEarned || 0) + n; }
function spend(n){ if (coins() < n) return false; S.progress.coinSpent = (+S.progress.coinSpent || 0) + n; return true; }

/** 開新任務時：記錄今天第幾次玩這關（決定金幣倍率），套用基地能力 */
function applyPerks(c){
  const cd = coinDay(); cd.n[c.stage] = (cd.n[c.stage] || 0) + 1;
  c.plays = cd.n[c.stage]; c.cmult = farmMult(c.plays); c.coins = 0; c.radar = 0;
  if (baseLv() >= 3 && c.stage !== 'BOSS' && c.stage !== 'WORDS') { c.shields++; c.maxShields++; }
}
function coinGain(c, typing){
  let g = c.stage === 'BOSS' ? COIN.boss : NO_STARS.includes(c.stage) ? COIN.harbor : COIN.base;
  if (typing) g += COIN.typing;
  g *= feverMult(c.combo);
  if (baseLv() >= 2) g *= 1.2;
  if (baseLv() >= 5) g *= 2;
  g *= 1 + petBonus();
  g *= c.cmult == null ? 1 : c.cmult;
  return Math.max(1, Math.round(g));
}

  let s = `<svg viewBox="0 0 240 130" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="sky${lv}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${space ? '#1b1446' : '#5cc8ff'}"/><stop offset="1" stop-color="${space ? '#4b2a8c' : '#c4efff'}"/></linearGradient></defs>
    <rect width="240" height="130" fill="url(#sky${lv})"/>`;
  if (space) s += [[20, 18], [60, 30], [200, 14], [225, 40], [150, 22], [95, 12]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.8" fill="#fff"/>`).join('');
  s += `<rect y="104" width="240" height="26" fill="${space ? '#6b6f8a' : '#3fb24d'}"/><rect y="104" width="240" height="5" fill="${space ? '#8d91ad' : '#2b8a3e'}"/>`;
  if (lv >= 5) s += `<rect x="30" y="78" width="180" height="27" fill="#9aa3b5" stroke="#1b2440" stroke-width="3"/>`
    + [0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect x="${32 + i * 22}" y="70" width="12" height="10" fill="#9aa3b5" stroke="#1b2440" stroke-width="3"/>`).join('')
    + `<text x="200" y="62" font-size="34">🚀</text>`;
  if (lv >= 2) s += [52, 172].map(x => `<rect x="${x}" y="44" width="16" height="61" fill="#6c7a99" stroke="#1b2440" stroke-width="3"/><circle cx="${x + 8}" cy="40" r="7" fill="#7df9ff" stroke="#1b2440" stroke-width="3"/>`).join('');
  s += `<rect x="100" y="68" width="40" height="37" fill="#b5651d" stroke="#1b2440" stroke-width="3"/>
    <polygon points="94,70 120,46 146,70" fill="#8b3a1a" stroke="#1b2440" stroke-width="3" stroke-linejoin="round"/>

  return s + '</svg>';
}

/* ---------- 扭蛋與圖鑑 ---------- */
function rollPet(){
  const P = S.progress, x = Math.random() * 100;
  P.pity = (+P.pity || 0) + 1;
  let r = x < RARITY.M.p ? 'M' : x < RARITY.M.p + RARITY.E.p ? 'E' : x < RARITY.M.p + RARITY.E.p + RARITY.R.p ? 'R' : 'C';
  if (P.pity >= PITY && (r === 'C' || r === 'R')) r = 'E';
  if (r === 'E' || r === 'M') P.pity = 0;
  const pool = PETS.filter(p => p[4] === r);
  return pool[Math.floor(Math.random() * pool.length)];
}
function openGacha(){
  const left = Math.max(1, PITY - (+S.progress.pity || 0)), c = coins();
  modal(`<h2>🥚 神祕扭蛋機</h2>
    <div class="gacha-box" id="g-box"><div class="machine">🎰</div></div>
    <div class="hint">⚪ 普通 50%・🔵 稀有 30%・🟣 史詩 15%・🌈 神話 5%<br>再抽 <b>${left}</b> 次內，保證抽到史詩以上！</div>
    <div class="coin-big" style="margin-top:6px">🪙 ${c}</div>
    ${c < GACHA_COST ? '<div class="err">金幣不夠，去闖關賺金幣吧！</div>' : ''}
    <div class="row"><button class="btn ghost" data-close>回基地</button><button class="btn gacha" id="g-go" ${c < GACHA_COST ? 'disabled' : ''}>抽一次 🪙${GACHA_COST}</button></div>`);
  $('#g-go').onclick = doGacha;
}
function doGacha(){

function coinBurst(gain, fm){
  const g = pivot(), n = fm === 3 ? 12 : fm === 1.5 ? 8 : 5;

    d.className = 'coin-px'; d.textContent = fm === 3 && i % 3 === 0 ? '💎' : '🪙';

function updateRadar(){
  const c = S.progress && S.progress.current;
  const can = !!(c && baseLv() >= 4 && c.stage !== 'BOSS' && !c.radar && S.q && !S.locked && !S.typ && !S.spell && $('#scr-game').classList.contains('active'));
  $('#btn-radar').classList.toggle('hidden', !can);
}
function useRadar(){
  const c = S.progress.current;
  if (!c || c.radar || S.locked || S.typ || S.spell || c.stage === 'BOSS' || baseLv() < 4) return;
  const wrong = [...document.querySelectorAll('#targets .enemy')].filter(b => !b.disabled && b.dataset.v !== norm(S.q.answer));
  if (wrong.length < 2) return toast('只剩一個錯誤選項了，自己想想看！');
  const b = wrong[Math.floor(Math.random() * wrong.length)];
  c.radar = 1; save(); updateRadar();
  aim(center(b)); SFX.shoot();
  beam(pivot(), center(b), '#ffd23f').then(() => boom(b));
  toast('🎯 黃金副砲消去了一個錯誤答案！（這局用完了）');
}

/* ================= 任務 ================= */
function startMission(id, mode = 'normal'){
  const P = S.progress;
  if (P.current) {
    if (P.current.stage === id && id !== 'WORDS') return playMission();
    return confirmBox('你有一個任務還沒打完，要放棄它、開始新任務嗎？', '放棄並開始', () => { P.current = null; startMission(id, mode); });
  }
  if (id === 'WORDS') return startWords(mode);
  if (id === 'MONSTER') return startMonsters();
  let qids;
  if (id === 'BOSS') {
    qids = [];
    Object.keys(BOSS_MIX).forEach(sid => qids.push(...shuffle(S.questions.filter(q => q.stage === sid)).slice(0, BOSS_MIX[sid]).map(q => q.id)));
    qids = shuffle(qids);
  } else {
    // 隨機抽 STAGE_DRAW 題，再照題庫順序排（題庫順序＝由淺到深）
    const pool = S.questions.filter(q => q.stage === id).map(q => q.id);
    const picked = new Set(shuffle(pool).slice(0, STAGE_DRAW));
    qids = pool.filter(x => picked.has(x));
  }
  if (!qids.length) return toast('這一關目前沒有題目喔');
  const boss = id === 'BOSS';
  P.current = { stage:id, qids, idx:0, shields: boss ? 5 : 3, maxShields: boss ? 5 : 3, timer: boss ? 40 : 0,
                score:0, combo:0, maxCombo:0, correct:0, kills:0, bossHp:qids.length, startedAt:Date.now() };
  applyPerks(P.current);
  save();
  playMission();
}
function playMission(){
  const c = S.progress.current, st = stageOf(c.stage);
  show('scr-game');
  $('#feedback').className = 'feedback hidden';
  const bn = $('#banner');

/* ---------- 射擊特效 ---------- */
function pivot(){ const g = $('#gun'); return { x: g.offsetLeft, y: g.offsetTop + g.offsetHeight * .85 }; }
function center(el){
  const ar = $('#arena'), a = ar.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left - a.left + r.width / 2, y: r.top - a.top + ar.scrollTop + r.height / 2 };
}
function aim(p){
  const g = $('#gun');
  if (!p) { g.style.transform = 'translateX(-50%)'; return; }
  const o = pivot(), ang = Math.atan2(p.x - o.x, o.y - p.y) * 180 / Math.PI;
  g.style.transform = `translateX(-50%) rotate(${ang}deg)`;
}
function beam(a, b, color){
  const d = document.createElement('div');
  d.className = 'beam';
  d.style.cssText = `left:${a.x}px;top:${a.y - 3}px;width:${Math.hypot(b.x - a.x, b.y - a.y)}px;--a:${Math.atan2(b.y - a.y, b.x - a.x)}rad;--c:${color}`;
  $('#fx').append(d); setTimeout(() => d.remove(), 420);
  return new Promise(r => setTimeout(r, 170));
}
function fireAt(el){
  const p = center(el); aim(p); SFX.shoot();
  if (baseLv() >= 2) { const o = pivot(); beam({ x:o.x - 16, y:o.y + 8 }, p, '#ff6bd6'); }  // 雙管能量塔：第二道光束
  return beam(pivot(), p, '#5ff');
}
function boom(el){
  const p = center(el), colors = ['#ffd23f', '#ff6b6b', '#4dabf7', '#69db7c', '#fff'];
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('div'), ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
    d.className = 'px';
    d.style.cssText = `left:${p.x}px;top:${p.y}px;--c:${colors[i % 5]};--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px`;
    $('#fx').append(d); setTimeout(() => d.remove(), 700);
  }
  el.classList.add('hit'); el.disabled = true;
}
function counterFire(el){ el.classList.add('miss'); setTimeout(() => el.classList.remove('miss'), 460); return beam(center(el), pivot(), '#ff3355'); }
function floatText(text, cls = '', dy = 0){
  const g = pivot(), d = document.createElement('div');
  d.className = 'float ' + cls; d.textContent = text;
  d.style.left = g.x + 'px'; d.style.top = (g.y - 120 + dy) + 'px';
  $('#fx').append(d); setTimeout(() => d.remove(), 1150);
}
function damage(){

/* ---------- 作答：射擊 ---------- */
async function shootChoice(btn, value){
  if (S.locked) { sayAns(value); return; } // 作答後再點選項：只唸發音，不扣分
  S.locked = true; clearTimer();
  sayAns(value);                           // 點下去就唸出這個答案
  await fireAt(btn);
  const ok = norm(value) === norm(S.q.answer);
  if (ok) boom(btn);
  else { await counterFire(btn); damage(); revealCorrect(); sayAns(S.q.answer, true); } // 答錯接著唸正確答案
  resolve(ok, value);
}
function shootLetter(btn, ch){
  const sp = S.spell;
  if (S.locked || !sp || btn.disabled) return;
  const need = sp.word[sp.pos];
  sayAns(ch.toUpperCase());                // 唸出字母
  fireAt(btn);
  document.querySelectorAll('#targets .hint').forEach(b => b.classList.remove('hint'));
  if (ch === need) {
    boom(btn);
    const blank = document.querySelectorAll('#blanks .blank')[sp.pos];
    blank.textContent = ch; blank.classList.add('filled');
    sp.pos++;
    if (sp.pos >= sp.word.length) { S.locked = true; clearTimer(); sayAns(S.q.answer, true); setTimeout(() => resolve(!sp.hurt, sp.word), 300); }
    return;
  }
  counterFire(btn);
  if (!sp.hurt) { // 每個單字只扣一次盾牌
    sp.hurt = true; damage();
    if (S.progress.current.shields <= 0) { S.locked = true; clearTimer(); revealCorrect(); sayAns(S.q.answer, true); return resolve(false, ch); }
  }
  const right = [...document.querySelectorAll('#targets .enemy')].find(b => !b.disabled && b.dataset.ch === need);
  if (right) right.classList.add('hint');
}

 
const isSep = ch => !/[a-z]/.test(ch);   
function sepSlot(ch){ return `<span class="tslot sep">${ch === ' ' ? '' : esc(ch)}</span>`; }
function drawSlots(okAll){
  const t = S.typ; if (!t) return;
  $('#tslots').innerHTML = [...t.word].map((ch, i) => {
    if (isSep(ch)) return sepSlot(ch);
    const v = t.input[i];
    if (okAll) return `<span class="tslot ok">${esc(ch)}</span>`;
    if (v) return `<span class="tslot">${esc(v)}</span>`;
    if (i === 0 && t.hint >= 1) return `<span class="tslot ghost ${t.input.length === 0 ? 'cur' : ''}">${esc(ch)}</span>`;
    return `<span class="tslot ${i === t.input.length ? 'cur' : ''}"></span>`;
  }).join('');
}
function wordleColors(guess, ans){
  const res = Array(guess.length).fill('x'), pool = {};
  for (let i = 0; i < ans.length; i++) { if (guess[i] === ans[i]) res[i] = 'g'; else pool[ans[i]] = (pool[ans[i]] || 0) + 1; }
  for (let i = 0; i < guess.length; i++) { if (res[i] !== 'g' && pool[guess[i]]) { res[i] = 'y'; pool[guess[i]]--; } }
  return res;
}
function typeKey(k){
  const t = S.typ;
  if (!t || S.locked) return;
  if (k === '✔') return submitType();
  SFX.key();
  if (k === '⌫') {
    t.input = t.input.slice(0, -1);
    while (t.input && isSep(t.input[t.input.length - 1])) t.input = t.input.slice(0, -1);
  } else if (t.input.length < t.word.length) {
    t.input += k;
    while (t.input.length < t.word.length && isSep(t.word[t.input.length])) t.input += t.word[t.input.length];
  }
  drawSlots();
}
/* ================= 防作弊 =================
   1. 遊戲畫面禁止複製、貼上、拖放、右鍵
   2. 作答中離開畫面（切 App／切分頁查 Google）超過 2 秒 → 這題答對也不算
   3. 鍵盤輸入快到不像人手打（自動輸入／語音輸入工具）→ 清掉重打
   標記的題目會在 Log 的 chosen 欄前面加上「⚠離開」「⚠貼上」「⚠自動輸入」 */
const inGame = () => $('#scr-game').classList.contains('active') && S.q && !S.locked;
function markCheat(kind, msg){

}
['copy', 'cut', 'paste', 'drop', 'contextmenu', 'dragstart'].forEach(ev =>
  document.addEventListener(ev, e => {

let awayAt = 0;
function goneAway(){ if (inGame() && !awayAt) awayAt = Date.now(); }
function cameBack(){

}
document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' ? goneAway() : cameBack());
window.addEventListener('blur', goneAway);
window.addEventListener('focus', cameBack);
let keyTimes = [];
window.addEventListener('keydown', e => {
  if (!S.typ || S.locked || !$('#modal').classList.contains('hidden') || !$('#scr-game').classList.contains('active')) return;
  if (e.ctrlKey || e.metaKey || e.altKey || !e.isTrusted) { e.preventDefault(); return; }   // 擋 Ctrl+V、⌘V 等快捷鍵
  if (e.repeat) { e.preventDefault(); return; }   // 按住不放的連發不算（避免被誤判成自動輸入）
  if (/^[a-z]$/i.test(e.key)) {
    const now = Date.now();
    keyTimes = [...keyTimes, now].filter(t => now - t < 150).slice(-4);
    if (keyTimes.length >= 4) {             // 150 毫秒內打 4 個字母，人手做不到
      keyTimes = []; S.typ.input = ''; drawSlots();
      return markCheat('自動輸入', '⌨️ 打太快了！請一個字母一個字母自己打');
    }
  }
  if (/^[a-z]$/i.test(e.key)) typeKey(e.key.toLowerCase());
  else if (e.key === 'Backspace') { e.preventDefault(); typeKey('⌫'); }
  else if (e.key === 'Enter') { e.preventDefault(); typeKey('✔'); }
});
async function submitType(){
  const t = S.typ, target = $('#type-target');
  if (t.input.length < t.word.length) return toast(`還差 ${t.word.length - t.input.length} 個字母喔`);
  const guess = t.input, colors = wordleColors(guess, t.word);
  $('#trows').insertAdjacentHTML('beforeend', `<div class="trow">${[...guess].map((ch, i) => `<span class="${colors[i]}">${esc(ch)}</span>`).join('')}</div>`);
  t.input = '';
  if (guess === t.word) {
    S.locked = true; clearTimer();
    drawSlots(true);
    sayAns(t.word);                        // 拼對了唸出單字
    await fireAt(target); boom(target);
    setTimeout(() => resolve(!t.hurt, guess), 300);
    return;
  }
  t.tries++;
  fireAt(target); counterFire(target);
  if (!t.hurt) { 
    t.hurt = true; damage();
    if (S.progress.current.shields <= 0) { S.locked = true; clearTimer(); revealCorrect(); sayAns(S.q.answer); return resolve(false, guess); }
  }
  if (t.tries >= 3) { S.locked = true; clearTimer(); revealCorrect(); sayAns(S.q.answer); return resolve(false, guess); }
  t.hint = t.tries;
  $('#t-hint').innerHTML = t.tries === 1
    ? `💡 提示：第一個字母是 <b>${esc(t.word[0].toUpperCase())}</b>，看看上面的顏色再試一次`
    : `💡 最後機會！用這些字母：<b>${esc(shuffle([...t.word].filter(ch => !isSep(ch))).join(' ').toUpperCase())}</b>`;
  drawSlots();
}

function startTimer(sec, left = sec){

function timeUp(){

function resolve(ok, chosen){
  const P = S.progress, c = P.current, q = S.q, typing = isTyping(q);
  const cheat = S.cheat;
  const log = { stage:c.stage, qid:q.id, correct:ok && !cheat, chosen:(cheat ? '⚠' + cheat + ' ' : '') + String(chosen == null ? '' : chosen).slice(0, 60) };
  // 作弊答對：不加分、不算連擊、單字不升級，題目進怪獸監獄再練一次（不扣盾牌）
  const cheated = ok && !!cheat;
  if (cheated) ok = false;
  const partial = !ok && !cheated && typing && chosen === q.answer.toLowerCase();
  let healed = false, gain = 0;
  if (ok) {
    c.correct++; c.combo++; c.maxCombo = Math.max(c.maxCombo, c.combo);
    const pts = 100 + (c.combo - 1) * 20 + (c.timer ? S.timeLeft * 3 : 0) + (typing ? 50 : 0);
    c.score += pts;
    floatText('+' + pts + (typing ? ' ⌨️' : '') + (c.combo > 1 ? '  COMBO x' + c.combo : ''));
    SFX.hit();
    // 金幣與每日任務：只有自己答對才會走到這裡（作弊的題目 ok 已經被改成 false）
    gain = coinGain(c, typing);
    c.coins = (c.coins || 0) + gain; earn(gain); questAdd('ok');
    coinBurst(gain, feverMult(c.combo));
    if (c.combo % 5 === 0 && c.shields < c.maxShields) { c.shields++; healed = true; setTimeout(SFX.heal, 250); }
    if (c.stage === 'BOSS') c.bossHp = Math.max(0, c.bossHp - 1);
  } else c.combo = 0;
  if (q.wid && !cheated) {   // 作弊答對：單字等級不升也不降，保留原本的學習紀錄
    const today = dayNum(), lv = (P.words[q.wid] || [0])[0];
    if (ok && c.mode !== 'review') { const b = typing ? Math.min(5, lv + 1) : Math.min(3, lv + 1); P.words[q.wid] = [Math.max(b, lv), today + WORD_GAPS[Math.max(b, lv)]]; }
    else if (!ok) P.words[q.wid] = [1, today];
  }
  const monMsg = monsterUpdate(q, ok);
  c.idx++;
  renderHUD();
  
  if (c.shields <= 0) S.pendingResult = finishMission(false);
  else if (c.idx >= c.qids.length) S.pendingResult = finishMission(true);
  save([log]);
  showFeedback(ok, q, healed, monMsg, partial, cheated, gain);
}
function showFeedback(ok, q, healed, monMsg, partial, cheated, gain){

    ${cheated ? '<div class="fb-cheat">作答時有離開畫面、貼上或自動輸入，這題答對也不加分、沒有金幣、不算連擊和任務。<br>題目已放進怪獸監獄，自己想出來再打倒牠！</div>' : ''}
    ${gain ? `<div class="fb-heal" style="color:#b07d00">🪙 +${gain} 金幣${feverMult(S.progress.current ? S.progress.current.combo : 0) > 1 ? '（連擊加倍！）' : ''}</div>` : ''}

}
function next(){
  if (S.pendingResult) { const r = S.pendingResult; S.pendingResult = null; return showResult(r); }
  renderQuestion();
}
function finishMission(clear){
  const P = S.progress, c = P.current, total = c.qids.length, acc = c.correct / total;
  const stars = clear ? (acc >= .9 ? 3 : acc >= .7 ? 2 : 1) : 0;
  const prev = P.stars[c.stage] || 0;
  // 過關獎勵金幣（星星是用「自己答對」的題數算的，作弊題不算）
  const bonus = clear ? Math.round((stars * 20 + (c.stage === 'BOSS' ? 100 : 0)) * (c.cmult == null ? 1 : c.cmult)) : 0;
  if (bonus) earn(bonus);
  if (clear && (c.stage === 'S4' || c.stage === 'S5')) questAdd('lr');
  if (clear && c.stage === 'WORDS') questAdd('mk');
  const res = { clear, stage:c.stage, mode:c.mode, stars, prev, newBest:false, correct:c.correct, total,
                score:c.score, maxCombo:c.maxCombo, kills:c.kills || 0, firstBoss:false,
                coins:c.coins || 0, bonus, cmult:c.cmult == null ? 1 : c.cmult, plays:c.plays || 1 };
  if (clear && !NO_STARS.includes(c.stage)) {
    if (stars > prev) { P.stars[c.stage] = stars; res.newBest = true; }
    if (c.stage === 'BOSS') { res.firstBoss = !P.bossWins; P.bossWins = (P.bossWins || 0) + 1; }
  }
  P.score += c.score; P.plays = (P.plays || 0) + 1;
  P.current = null;
  return res;
}
function showResult(r){
  stopPlay();
  const st = stageOf(r.stage);
  const tier = r.stage === 'BOSS' && r.clear ? 4 : r.stars;
  const idx = STAGES.findIndex(s => s.id === r.stage);
  const unlocked = r.clear && r.prev === 0 && idx >= 0 && idx < STAGES.length - 1 && isUnlocked(idx + 1);
  const stats = `<div class="res-stats"><div>答對<b>${r.correct}/${r.total}</b></div><div>得分<b>${r.score}</b></div><div>${r.kills ? '消滅怪獸' : '最高連擊'}<b>${r.kills || r.maxCombo}</b></div></div>`;
  const monLeft = monsterList().length;
  const coinNote = `<div class="res-note" style="color:#b07d00;font-size:18px">🪙 這局賺到 ${r.coins + r.bonus} 金幣${r.bonus ? `（答題 ${r.coins}＋過關獎勵 ${r.bonus}）` : ''}</div>`
    + (r.cmult < 1 ? `<div class="res-note">🔁 今天第 ${r.plays} 次玩這關，金幣 x${r.cmult}。去別的島可以拿全額！</div>` : '');
  let html;
  if (r.clear) {
    html = `<div class="res-title win">MISSION CLEAR!</div><div style="font-weight:900;margin-top:6px">${st.icon} ${st.zh}</div>
      <div class="res-stars">${[1,2,3].map(i => `<span class="${i <= r.stars ? 'on' : ''}" style="--i:${i}">★</span>`).join('')}</div>
      ${!NO_STARS.includes(r.stage) ? `<div class="res-shield">${shieldSVG(TIERS[tier].c, 80)}<div>${r.newBest || r.firstBoss ? '🎉 獲得 ' : ''}${TIERS[tier].n}</div></div>` : ''}
      ${stats}${coinNote}
      ${unlocked ? `<div class="res-note">⛵ 新的島出現了：${STAGES[idx + 1].icon} ${STAGES[idx + 1].zh}</div>` : ''}
      ${r.stage === 'WORDS' ? `<div class="res-note">📒 已精熟 ${wordStats().mastered} 個單字，繼續加油！</div>` : ''}
      ${monLeft ? `<div class="res-note">👾 怪獸監獄還有 ${monLeft} 隻，記得去消滅牠們！</div>` : ''}
      ${r.clear && r.stars < 3 && !NO_STARS.includes(r.stage) ? '<div class="res-note">答對 9 成以上就能拿 3 顆星金盾！</div>' : ''}`;
    SFX.win(); confetti();
  } else {
    html = `<div class="res-title lose">SHIELDS DOWN!</div><div class="big-emoji">🛡️💥</div>
      <div style="font-weight:900">盾牌被打光了…</div>${stats}${coinNote}
      <div class="res-note">別灰心！答錯的題目已經變成怪獸關進監獄，打倒牠們再回來挑戰 💪</div>`;
    SFX.lose();
  }
  html += `<div class="row"><button class="btn ghost" id="res-map">🏠 回地圖</button><button class="btn primary" id="res-again">${r.clear ? '再玩一次' : '再挑戰'}</button></div>`;
  $('#result-card').innerHTML = html;
  $('#res-map').onclick = goMap;
  $('#res-again').onclick = () => {
    if (r.stage === 'WORDS') { goMap(); return openWordIsland(); }
    if (r.stage === 'MONSTER') { goMap(); return openMonsterIsland(); }
    startMission(r.stage);
  };
  show('scr-result');
}
function confetti(){
  const colors = ['#ffd23f', '#ff6b6b', '#4dabf7', '#69db7c', '#9775fa'];
  for (let i = 0; i < 70; i++) {
    const d = document.createElement('div');
    d.className = 'cf';
    d.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % 5]};animation-duration:${1.8 + Math.random() * 1.8}s;animation-delay:${Math.random() * .6}s`;
    document.body.append(d); setTimeout(() => d.remove(), 4500);
  }
}

/* ================= 口說練習（Google 網頁不准用麥克風，所以另開一頁） ================= */
const SPEAK_URL = 'https://wslai0101-web.github.io/flyers-speaking/';
function openSpeak(){
  modal('<div class="big-emoji">🗣️</div><h2>口說練習</h2><div class="hint">準備中…</div>');
  flush();
  api('speakTicket', S.token).then(t => {
    modal(`<div class="big-emoji">🗣️</div><h2>口說練習</h2>
      <div class="panel-note">會開一個新分頁，用麥克風練習找不同、看圖說故事、問答。<br>🪙 說對有金幣，每天最多 150。練完關掉分頁回來，金幣就會更新。<br>💻 請用電腦的 Chrome 或 Edge。</div>
      <div class="row"><button class="btn ghost" data-close>取消</button><a class="btn primary" id="sp-go" style="text-decoration:none;color:inherit" href="${SPEAK_URL}#c=${esc(t)}" target="_blank" rel="noopener">▶ 開始練習</a></div>`);
    $('#sp-go').onclick = () => setTimeout(closeModal, 100);
  }).catch(e => { closeModal(); if (e.message === 'AUTH') return sessionExpired(); toast('連線失敗，請再試一次'); });
}
function refreshSpeak(){
  if (!S.token || !S.progress) return;
  api('speakStatus', S.token).then(r => {
    const v = +r.speakCoins || 0;
    if (v === (+S.progress.speakCoins || 0)) return;
    if (v > (+S.progress.speakCoins || 0)) toast(`🗣️ 口說練習賺到 🪙 +${v - (+S.progress.speakCoins || 0)}`, 3000);
    S.progress.speakCoins = v;
    if ($('#scr-map').classList.contains('active')) renderMap();
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshSpeak(); });

/* ================= PK 排行榜 ================= */
function openPK(){
  show('scr-pk');
  $('#podium').innerHTML = '<div class="loader"></div>'; $('#pk-list').innerHTML = '';
  flush();
  api('getLeaderboard', S.token).then(b => { S.pk = b; renderPK(); })
    .catch(e => { if (e.message === 'AUTH') return sessionExpired(); $('#podium').innerHTML = `<p class="hint">讀取失敗：${esc(e.message)}</p>`; });
}
function relDay(t){
  if (!t) return '還沒玩過';
  const d = dayNum() - Math.floor((t - new Date().getTimezoneOffset() * 60000) / 86400000);
  return d <= 0 ? '今天有玩' : d === 1 ? '昨天有玩' : `${d} 天前玩過`;
}
function renderPK(){
  const m = PK_METRICS.find(x => x.k === S.pkMetric) || PK_METRICS[0], podOn = UI.podium !== false;
  $('#pk-tabs').innerHTML = PK_METRICS.map(x => `<button class="pk-tab ${x.k === m.k ? 'on' : ''}" data-k="${x.k}">${x.n}</button>`).join('')
    + `<button class="pk-tab" id="pk-pod">🏅 頒獎台 ${podOn ? '▴' : '▾'}</button>`;
  $('#pk-tabs').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { SFX.click(); S.pkMetric = b.dataset.k; renderPK(); });
  $('#pk-pod').onclick = () => { setUI('podium', !podOn); renderPK(); };

  const val = p => m.k === 'accuracy' && !p.answered ? -1 : (p[m.k] || 0);
  const list = (S.pk || []).slice().sort((a, b) => val(b) - val(a) || b.score - a.score);
  const fmt = p => m.k === 'accuracy' && !p.answered ? '—' : (p[m.k] || 0) + m.unit;
  const medal = ['🥇', '🥈', '🥉'];
  $('#podium').style.display = podOn ? '' : 'none';
  $('#podium').innerHTML = [1, 0, 2].filter(i => list[i]).map(i => { const p = list[i];
    return `<div class="pod p${i + 1}"><div class="avatar">${esc(p.avatar)}</div><div class="pod-name">${esc(p.nickname)}</div>
      <div class="pod-val">${fmt(p)}</div><div class="pod-block">${medal[i]}</div></div>`; }).join('');
  $('#pk-list').innerHTML = list.map((p, i) => `<div class="pk-row ${p.slot === S.player.slot ? 'me' : ''}">
    <div class="pk-rank">${i < 3 ? medal[i] : i + 1}</div><span class="avatar sm">${esc(p.avatar)}</span>
    <div class="grow"><b>${esc(p.nickname)}</b>${p.slot === S.player.slot ? '（你）' : ''}<br><span class="pk-more">${rankName(p.stars)}・${relDay(p.lastPlayed)}・點我看詳細 ▾</span></div>
    <div class="pk-big">${fmt(p)}<small>${m.n}</small></div>
    <div class="pk-stats"><span>⭐ ${p.stars}</span><span>🥇 金盾 ${p.gold}</span>${p.bossWins ? '<span>💎 打倒魔王</span>' : ''}<span>📒 精熟 ${p.mastered}</span><span>👾 已消滅 ${p.killTotal || 0}・待消滅 ${p.monsters || 0}</span><span>✍️ 答 ${p.answered} 題</span><span>🎯 ${p.answered ? p.accuracy + '%' : '—'}</span></div></div>`).join('') || '<p class="hint">還沒有玩家</p>';
  $('#pk-list').querySelectorAll('.pk-row').forEach(r => r.onclick = () => r.classList.toggle('open'));
}
$('#pk-back').onclick = () => { SFX.click(); goMap(); };
$('#pk-refresh').onclick = () => { SFX.click(); openPK(); };

 
function leaveGame(){
  flush();
  if (S.pendingResult) { stopPlay(); return next(); }
  goMap();
  toast('進度已存好，地圖上方可以「繼續作答」');
}
$('#btn-home').onclick = () => { SFX.click(); leaveGame(); };
$('#btn-radar').onclick = useRadar;
$('#btn-pause').onclick = () => {
  SFX.click(); clearTimer();
  modal(`<div class="big-emoji">⏸</div><h2>暫停中</h2><div class="hint">進度已經自動存好，下次可以從這一題接著做</div>
    <div class="row"><button class="btn ghost" id="pz-map">🏠 回地圖</button><button class="btn primary" id="pz-go">繼續</button></div>`);
  $('#pz-go').onclick = () => {
    closeModal();
    const c = S.progress.current;
    if (c && c.timer && !S.locked && S.timeLeft > 0) startTimer(c.timer, S.timeLeft); 
  };
  $('#pz-map').onclick = () => { closeModal(); leaveGame(); };
};
</script>
